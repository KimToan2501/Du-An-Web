
services:
  app:
    build: .
    container_name: pawspa-app
    # Remove port mapping as it will be accessed through nginx
    # ports:
    #   - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - pawspa-network

  mysql:
    image: mysql:8.0
    container_name: pawspa-mysql
    restart: always
    environment:
      MYSQL_DATABASE: db_service_pet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lab.sql:/docker-entrypoint-initdb.d/1-lab.sql
      - ./seed-data.sql:/docker-entrypoint-initdb.d/2-seed-data.sql
    networks:
      - pawspa-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pawspa-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - pawspa-network

  nginx:
    image: nginx:alpine
    container_name: pawspa-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pawspa-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: pawspa-jenkins
    restart: always
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /bin/docker:/usr/bin/docker
    user: root
    networks:
      - pawspa-network

networks:
  pawspa-network:
    driver: bridge

volumes:
  mysql_data:
  jenkins_home:
